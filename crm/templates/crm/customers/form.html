{% extends "crm/base.html" %}

{% block title %}
{% if customer %}Edit Customer{% else %}Add Customer{% endif %}
{% endblock %}


{% block content %}

<div class="max-w-2xl">

    <h2 class="text-3xl font-bold mb-8">

        {% if customer %}
            Edit Customer
        {% else %}
            Add Customer
        {% endif %}

    </h2>


    <form method="POST" class="bg-white p-8 rounded-xl shadow-sm">

        {% csrf_token %}


        <div class="space-y-6">


            <div>

                <label class="block mb-2 font-medium">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    value="{{ customer.name|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ customer.email|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ customer.phone|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Company
                </label>

                <input
                    type="text"
                    name="company"
                    value="{{ customer.company|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Status
                </label>

                <select
                    name="status"
                    class="w-full border rounded-lg px-4 py-3"
                >

                    <option
                        value="active"
                        {% if customer.status == "active" or not customer %}
                            selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="inactive"
                        {% if customer.status == "inactive" %}
                            selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Notes
                </label>

                <textarea
                    name="notes"
                    rows="5"
                    class="w-full border rounded-lg px-4 py-3"
                >{{ customer.notes|default:'' }}</textarea>

            </div>


            <div class="flex gap-3">

                <button
                    type="submit"
                    class="bg-gray-900 text-white px-6 py-3 rounded-lg"
                >
                    {% if customer %}
                        Save Changes
                    {% else %}
                        Create Customer
                    {% endif %}
                </button>

                <a
                    href="{% url 'customer_list' %}"
                    class="px-6 py-3 border rounded-lg"
                >
                    Cancel
                </a>

            </div>

        </div>

    </form>

</div>

{% endblock %}
