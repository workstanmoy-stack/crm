{% extends "crm/base.html" %}

{% block title %}
{% if lead %}Edit Lead{% else %}Add Lead{% endif %}
{% endblock %}

{% block content %}

<div class="max-w-2xl">

    <h2 class="text-3xl font-bold mb-8">

        {% if lead %}
            Edit Lead
        {% else %}
            Add Lead
        {% endif %}

    </h2>


    <form method="POST" class="bg-white p-8 rounded-xl shadow-sm">

        {% csrf_token %}

        <div class="space-y-6">

            <div>

                <label class="block mb-2 font-medium">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    value="{{ lead.name|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ lead.email|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ lead.phone|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Company
                </label>

                <input
                    type="text"
                    name="company"
                    value="{{ lead.company|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Lead Source
                </label>

                <input
                    type="text"
                    name="source"
                    placeholder="Website, Facebook, Referral..."
                    value="{{ lead.source|default:'' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Status
                </label>

                <select
                    name="status"
                    class="w-full border rounded-lg px-4 py-3"
                >

                    <option value="new"
                        {% if lead.status == "new" or not lead %}
                            selected
                        {% endif %}>
                        New
                    </option>

                    <option value="contacted"
                        {% if lead.status == "contacted" %}selected{% endif %}>
                        Contacted
                    </option>

                    <option value="qualified"
                        {% if lead.status == "qualified" %}selected{% endif %}>
                        Qualified
                    </option>

                    <option value="lost"
                        {% if lead.status == "lost" %}selected{% endif %}>
                        Lost
                    </option>

                </select>

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Notes
                </label>

                <textarea
                    name="notes"
                    rows="5"
                    class="w-full border rounded-lg px-4 py-3"
                >{{ lead.notes|default:'' }}</textarea>

            </div>


            <div class="flex gap-3">

                <button
                    type="submit"
                    class="bg-gray-900 text-white px-6 py-3 rounded-lg"
                >
                    {% if lead %}
                        Save Changes
                    {% else %}
                        Create Lead
                    {% endif %}
                </button>

                <a
                    href="{% url 'lead_list' %}"
                    class="border px-6 py-3 rounded-lg"
                >
                    Cancel
                </a>

            </div>

        </div>

    </form>

</div>

{% endblock %}
