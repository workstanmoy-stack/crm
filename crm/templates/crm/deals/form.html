{% extends "crm/base.html" %}

{% block title %}
{% if deal %}Edit Deal{% else %}Add Deal{% endif %}
{% endblock %}

{% block content %}

<div class="max-w-2xl">

    <h2 class="text-3xl font-bold mb-8">

        {% if deal %}
            Edit Deal
        {% else %}
            Add Deal
        {% endif %}

    </h2>


    <form method="POST" class="bg-white p-8 rounded-xl shadow-sm">

        {% csrf_token %}

        <div class="space-y-6">

            <div>

                <label class="block mb-2 font-medium">
                    Deal Name
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    value="{{ deal.name|default:'' }}"
                    placeholder="Website Development Project"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Customer
                </label>

                <select
                    name="customer"
                    required
                    class="w-full border rounded-lg px-4 py-3"
                >

                    <option value="">
                        Select Customer
                    </option>

                    {% for customer in customers %}

                    <option
                        value="{{ customer.id }}"
                        {% if deal.customer_id == customer.id %}
                            selected
                        {% endif %}
                    >
                        {{ customer.name }}
                        {% if customer.company %}
                            — {{ customer.company }}
                        {% endif %}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    required
                    value="{{ deal.amount|default:'' }}"
                    placeholder="50000"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Stage
                </label>

                <select
                    name="stage"
                    class="w-full border rounded-lg px-4 py-3"
                >

                    <option value="proposal"
                        {% if deal.stage == "proposal" or not deal %}
                            selected
                        {% endif %}>
                        Proposal
                    </option>

                    <option value="negotiation"
                        {% if deal.stage == "negotiation" %}selected{% endif %}>
                        Negotiation
                    </option>

                    <option value="won"
                        {% if deal.stage == "won" %}selected{% endif %}>
                        Won
                    </option>

                    <option value="lost"
                        {% if deal.stage == "lost" %}selected{% endif %}>
                        Lost
                    </option>

                </select>

            </div>


            <div>

                <label class="block mb-2 font-medium">
                    Expected Close Date
                </label>

                <input
                    type="date"
                    name="expected_close_date"
                    value="{{ deal.expected_close_date|date:'Y-m-d' }}"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>


            <div class="flex gap-3">

                <button
                    type="submit"
                    class="bg-gray-900 text-white px-6 py-3 rounded-lg"
                >
                    {% if deal %}
                        Save Changes
                    {% else %}
                        Create Deal
                    {% endif %}
                </button>

                <a
                    href="{% url 'deal_list' %}"
                    class="border px-6 py-3 rounded-lg"
                >
                    Cancel
                </a>

            </div>

        </div>

    </form>

</div>

{% endblock %}
